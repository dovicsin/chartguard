<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Scripts only from this origin: nothing typed into the editor is ever executed. Inline styles are
		     allowed because ECharts writes style attributes into its tooltip markup. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
		/>
		<title>ChartGuard Playground</title>
		<link rel="stylesheet" href="./styles.css" />
		<script type="module" src="./main.js"></script>
	</head>
	<body>
		<header class="bar">
			<h1 class="bar__title">ChartGuard <span>playground</span></h1>
			<label class="bar__field"
				>Library
				<select id="library"></select
			></label>
			<label class="bar__field"
				>Input
				<select id="mode">
					<option value="json">JSON config</option>
					<option value="javascript">JavaScript</option>
					<option value="typescript">TypeScript</option>
				</select></label
			>
			<label class="bar__field bar__field--wide"
				>Example
				<select id="example"></select
			></label>
			<button id="share" class="bar__button" type="button">Share link</button>
			<p id="notice" class="bar__notice" role="status"></p>
		</header>
		<main class="layout">
			<section class="pane pane--editor" aria-labelledby="editor-title">
				<h2 id="editor-title" class="pane__title">
					Configuration <small id="editor-hint">JSON, validated as you type</small>
				</h2>
				<textarea id="editor" spellcheck="false" autocomplete="off" aria-describedby="syntax"></textarea>
				<p id="syntax" class="syntax" role="alert"></p>
				<button id="undo" class="undo" type="button" hidden>Undo fix</button>
			</section>
			<section class="pane pane--preview" aria-labelledby="preview-title">
				<h2 id="preview-title" class="pane__title">Result</h2>
				<div class="verdicts" aria-live="polite">
					<span class="verdict">Validator <span id="validator-verdict"></span></span>
					<span class="verdict">Runtime <span id="runtime-verdict"></span></span>
					<span id="schema" class="schema"></span>
				</div>
				<label id="chart-field" class="chart-field" hidden
					>Chart
					<select id="chart"></select
				></label>
				<div id="preview" class="preview"></div>
				<ul id="runtime-messages" class="runtime-messages" hidden></ul>
				<p id="runtime-note" class="runtime-note" hidden></p>
				<aside id="expected" class="expectation" hidden></aside>
			</section>
			<section class="pane pane--findings" aria-labelledby="findings-title">
				<h2 id="findings-title" class="pane__title">Validator findings</h2>
				<p id="summary" class="summary"></p>
				<ol id="diagnostics" class="findings"></ol>
				<h2 class="pane__title">Quality <small>advisory, never a verdict</small></h2>
				<ol id="quality" class="findings"></ol>
			</section>
		</main>
	</body>
</html>
