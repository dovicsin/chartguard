name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The lockfile is written by npm 11; npm 10 (bundled with Node 20/22) rejects it.
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run check
