name: ci
on:
  push:
  pull_request:
# The workflow only reads the repository; nothing it runs can write to it.
permissions:
  contents: read
# Runs of one ref share a group: on a pull request a newer push cancels the running check; branch
# pushes (main) each finish, so every commit keeps its result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    # A hang guard far above an honest run (build, corpora in Chrome, coverage), never a time budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The lockfile is written by npm 11; npm 10 (bundled with Node 20/22) rejects it.
      - run: npm install --global npm@11.6.2
      - run: npm ci
      # The Highcharts demos may not be committed (license); each run imports them at the pinned commit.
      - run: npm run conformance:import -- highcharts
      - run: npm run check
