name: ci
on:
  # Branch pushes only: a release pushes a tag per package, each the commit main already checked.
  push:
    branches: ['**']
  pull_request:
# The workflow only reads the repository; nothing it runs can write to it.
permissions:
  contents: read
# Runs of one ref share a group: on a pull request a newer push cancels the running check; branch
# pushes (main) each finish, so every commit keeps its result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    # A hang guard far above an honest run (build, corpora in Chrome, coverage), never a time budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The newest of each supported line; Node 26, the active LTS, is the target (CG-07-05).
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The lockfile is written by npm 11; npm 10 (bundled with Node 22) rejects it.
      - run: npm install --global npm@11.21.1
      - run: npm ci
      # The Highcharts demos may not be committed (license); each run imports them at the pinned commit.
      - run: npm run conformance:import -- highcharts
        env:
          # GitHub limits unauthenticated API calls per IP, which every hosted runner shares (HTTP 403).
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run check
      # The extension in a real VS Code (downloaded once per run; it needs Node 22+ and a display).
      - if: matrix.node == 26
        run: xvfb-run -a npm run test:vscode -w packages/integrations/vscode
      # And in the oldest VS Code the manifest accepts (engines.vscode), so the range it declares is tested.
      - if: matrix.node == 26
        run: xvfb-run -a npm run test:vscode -w packages/integrations/vscode
        env:
          VSCODE_TEST_VERSION: minimum
  # Each published package as its users get it (CG-07-05): packed, installed alone by npm in a fresh
  # project, loaded with import and require, its bin run, its declarations compiled; on every
  # platform, on the lowest Node the packages support (engines) and on the target.
  consumers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.12.0', 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run build
      # The committed schemas regenerate byte for byte on every platform and Node (CG-07-06).
      - run: npm run schema:check
      - run: node --test scripts/tests/consumers.test.mjs scripts/tests/smoke.test.mjs
  # Trends across commits (CG-07-03): every commit to main is measured and recorded in a history
  # that runs hand on through the Actions cache; a value that rose while still within its budget is
  # shown in the job summary, never a failure (the check job fails what is over budget).
  trend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A hang guard far above an honest run (build and every scenario), never a time budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The target Node; a trend compares runs on one Node major only.
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run build
      # The history of the latest earlier run: a cache key is written once, so each run saves its own.
      - uses: actions/cache/restore@v4
        with:
          path: bench-history.jsonl
          key: bench-history-${{ github.run_id }}
          restore-keys: bench-history-
      - name: Measure and record
        env:
          LABEL: ${{ github.sha }}
        run: npm run --silent bench -- --history bench-history.jsonl --label "$LABEL" | tee bench.txt
      - name: Trend in the job summary
        if: always() && hashFiles('bench.txt') != ''
        run: |
          {
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always() && hashFiles('bench-history.jsonl') != ''
        uses: actions/cache/save@v4
        with:
          path: bench-history.jsonl
          key: bench-history-${{ github.run_id }}
      - if: always() && hashFiles('bench-history.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bench-history
          path: bench-history.jsonl
          retention-days: 90
  # The GitHub Action on this repository's own examples (CG-06-08): a valid file passes with exit
  # code 0 and a SARIF log; an invalid one fails its step with 1 and its annotations, built from this
  # checkout and with the published CLI.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - id: valid
        uses: ./
        with:
          library: chartjs
          files: examples/chartjs-valid-subset.json
          sarif-file: chartguard.sarif
      - id: invalid
        uses: ./
        continue-on-error: true
        with:
          library: chartjs
          files: examples/chartjs-invalid.json
      # The published CLI, as users pin it (`chartguard-version`): the latest release from npm.
      - id: published
        uses: ./
        continue-on-error: true
        with:
          library: chartjs
          files: examples/chartjs-invalid.json
          chartguard-version: latest
      - name: Check the outcomes
        env:
          VALID: ${{ steps.valid.outputs.exit-code }}
          INVALID: ${{ steps.invalid.outputs.exit-code }}
          PUBLISHED: ${{ steps.published.outputs.exit-code }}
        run: |
          test "$VALID" = 0
          test "$INVALID" = 1
          test "$PUBLISHED" = 1
          node -e "const log = JSON.parse(require('fs').readFileSync('chartguard.sarif', 'utf8')); if (log.version !== '2.1.0') process.exit(1);"
